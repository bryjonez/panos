<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>DJI Terra 3D Mesh Viewer</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Cesium.js"></script>

  <link
    href="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  />

  <style>
  html, body, #cesiumContainer {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
  }

  .info {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 100;
    background: rgba(0,0,0,0.65);
    color: white;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.4;
    backdrop-filter: blur(5px);
  }

  .info b {
    color: #4fc3f7;
  }

  /* COMPLETELY HIDE CESIUM UI */

  .cesium-viewer-toolbar,
  .cesium-viewer-animationContainer,
  .cesium-viewer-timelineContainer,
  .cesium-viewer-bottom,
  .cesium-viewer-fullscreenContainer,
  .cesium-viewer-navigationContainer,
  .cesium-widget-credits,
  .cesium-credit-logoContainer {
      display: none !important;
  }

  .cesium-viewer {
      width: 100% !important;
      height: 100% !important;
  }

  .info {
      display: none !important;
  }

</style>
</head>

<body>

<div id="cesiumContainer"></div>

<div class="info">
  <b>Controls:</b><br>
  Left Mouse = Rotate<br>
  Right Mouse = Pan<br>
  Scroll = Zoom
</div>

<script>

(async () => {

  // ============================================
  // CREATE VIEWER
  // ============================================

  const viewer = new Cesium.Viewer("cesiumContainer", {

  terrain: Cesium.Terrain.fromWorldTerrain(),

  // REMOVE UI BUTTONS
  animation: false,
  timeline: false,
  geocoder: false,
  homeButton: false,
  sceneModePicker: false,
  baseLayerPicker: false,
  navigationHelpButton: false,
  fullscreenButton: false,

  infoBox: false,
  selectionIndicator: false,

  shadows: false
});

  // Better rendering quality
  viewer.scene.postProcessStages.fxaa.enabled = true;
  viewer.scene.globe.depthTestAgainstTerrain = true;
  viewer.resolutionScale = window.devicePixelRatio;

  // ============================================
  // LOAD TILESET
  // ============================================

  const tileset = await Cesium.Cesium3DTileset.fromUrl("./tileset.json", {

    maximumScreenSpaceError: 1,

    dynamicScreenSpaceError: false,

    skipLevelOfDetail: false,

    immediatelyLoadDesiredLevelOfDetail: true,

    preferLeaves: true
  });

  viewer.scene.primitives.add(tileset);

  // Wait until fully ready
  await tileset.readyPromise;

  // ============================================
  // ZOOM TO MODEL
  // ============================================

  await viewer.zoomTo(tileset);

  // ============================================
  // OPTIONAL EDGE CLEANUP
  // ============================================
  //
  // SAFER METHOD:
  // hide low-detail edge garbage
  // without clipping away the model
  //
  // ============================================

  tileset.maximumScreenSpaceError = 0.5;

  // ============================================
  // OPTIONAL COLOR IMPROVEMENTS
  // ============================================

  tileset.colorBlendMode = Cesium.Cesium3DTileColorBlendMode.HIGHLIGHT;

  // ============================================
  // LIGHTING
  // ============================================

  viewer.scene.light = new Cesium.DirectionalLight({
    direction: new Cesium.Cartesian3(
      0.2,
      -0.5,
      -1.0
    )
  });

  // ============================================
  // DEBUG
  // ============================================

  console.log("DJI Terra mesh loaded.");

})();

</script>

</body>
</html>
