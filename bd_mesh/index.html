<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DJI Terra 3D Mesh Viewer</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Cesium.js"></script>

  <link
    href="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  />

  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      backdrop-filter: blur(6px);
    }

    .info b {
      color: #4fc3f7;
    }
  </style>
</head>

<body>

<div id="cesiumContainer"></div>

<div class="info">
  <b>Controls:</b><br>
  Left Mouse = Rotate<br>
  Right Mouse = Pan<br>
  Scroll = Zoom
</div>

<script>
(async () => {

  // ==========================
  // CESIUM VIEWER SETUP
  // ==========================

  const viewer = new Cesium.Viewer("cesiumContainer", {

    animation: false,
    timeline: false,
    geocoder: false,
    homeButton: true,
    sceneModePicker: true,
    baseLayerPicker: true,
    navigationHelpButton: false,
    fullscreenButton: true,

    terrainProvider: await Cesium.createWorldTerrainAsync(),

    selectionIndicator: false,
    infoBox: false,

    shouldAnimate: true
  });

  // Better visual quality
  viewer.scene.postProcessStages.fxaa.enabled = true;
  viewer.scene.globe.depthTestAgainstTerrain = true;

  // ==========================
  // LOAD DJI TERRA TILESET
  // ==========================

  const tileset = await Cesium.Cesium3DTileset.fromUrl("./tileset.json", {

    maximumScreenSpaceError: 1,
    dynamicScreenSpaceError: false,

    skipLevelOfDetail: false,
    immediatelyLoadDesiredLevelOfDetail: true,

    preloadWhenHidden: true,
    preloadFlightDestinations: true,

    preferLeaves: true
  });

  viewer.scene.primitives.add(tileset);

  await tileset.readyPromise;

  // ==========================
  // AUTO ZOOM
  // ==========================

  viewer.zoomTo(tileset);

  // ==========================
  // OPTIONAL EDGE CLEANUP
  // ==========================
  //
  // These clipping planes hide messy
  // reconstruction edges.
  //
  // Increase DISTANCE = keeps more mesh
  // Decrease DISTANCE = trims more edges
  //
  // Set ENABLE_EDGE_TRIM to false
  // to disable completely.
  //
  // ==========================

  const ENABLE_EDGE_TRIM = true;

  if (ENABLE_EDGE_TRIM) {

    const DISTANCE = 140;

    tileset.clippingPlanes = new Cesium.ClippingPlaneCollection({

      planes: [

        // LEFT
        new Cesium.ClippingPlane(
          new Cesium.Cartesian3(1, 0, 0),
          DISTANCE
        ),

        // RIGHT
        new Cesium.ClippingPlane(
          new Cesium.Cartesian3(-1, 0, 0),
          DISTANCE
        ),

        // FRONT
        new Cesium.ClippingPlane(
          new Cesium.Cartesian3(0, 1, 0),
          DISTANCE
        ),

        // BACK
        new Cesium.ClippingPlane(
          new Cesium.Cartesian3(0, -1, 0),
          DISTANCE
        )

      ],

      unionClippingRegions: true,

      edgeWidth: 0
    });
  }

  // ==========================
  // HIGH QUALITY RENDERING
  // ==========================

  viewer.scene.screenSpaceCameraController.minimumZoomDistance = 1;

  viewer.resolutionScale = window.devicePixelRatio;

  // Sharper rendering
  viewer.scene.highDynamicRange = true;

  // ==========================
  // OPTIONAL LIGHTING
  // ==========================

  viewer.scene.light = new Cesium.DirectionalLight({
    direction: new Cesium.Cartesian3(
      0.3,
      -0.5,
      -1.0
    )
  });

  // ==========================
  // DEBUGGING
  // ==========================

  console.log("3D Mesh Loaded Successfully");

})();
</script>

</body>
</html>
